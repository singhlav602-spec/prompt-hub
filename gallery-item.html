  <!-- Google tag (gtag.js) — deferred until the browser is idle (or the
       visitor scrolls/taps, whichever comes first) instead of loading at
       initial paint. Same deferred pattern as index.html — analytics
       shouldn't block the critical rendering path on any page. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VTZJKRQ7S6');

    function loadGtagScript() {
      if (window.__gtagScriptLoaded) return;
      window.__gtagScriptLoaded = true;
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-VTZJKRQ7S6';
      document.head.appendChild(s);
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadGtagScript, { timeout: 4000 });
    } else {
      setTimeout(loadGtagScript, 2000);
    }
    ['scroll', 'keydown', 'click', 'touchstart'].forEach(evt =>
      window.addEventListener(evt, loadGtagScript, { once: true, passive: true })
    );
  </script>
